name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: unzip -q "$(ls *.zip | head -n 1)" -d proj
      - run: cd proj && gradle assembleDebug --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp proj/app/build/outputs/apk/debug/app-debug.apk SimplePrint.apk
          gh release create "build-${{ github.run_number }}" SimplePrint.apk --title "Simple Print build ${{ github.run_number }}" --notes "Debug APK"
